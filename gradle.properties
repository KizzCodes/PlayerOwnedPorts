# Build with the JDK that ships inside the BotWithUs client (Java 20).
# This guarantees the compiled bytecode is loadable by the client at runtime,
# and means you do NOT need to install a separate JDK.
#
# Uncomment and point this at your own client JDK. To find it, look for the
# folder under C:/Users/<you>/ that contains \jre\bin\javac.exe -- the client
# installs into a randomly-named dot-folder, so the path differs per machine.
# Left unset so no personal path is baked into the repo; build.ps1 finds it itself.
#org.gradle.java.home=C:/Users/<you>/.<client-folder>/jre

org.gradle.jvmargs=-Xmx1024m
org.gradle.daemon=true